<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoo Day</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="container-jogo">
        <button id="trocarModo">Modo: PC</button>
        <div id="controlesMobile">
            <button onclick="realizarAcao()" class="actionButton"></button>
            <div>
                <button data-direcao="w" class="upButton">▲</button>
                <div>
                    <button data-direcao="a" class="leftButton">◀</button>
                    <button data-direcao="s" class="downButton">▼</button>
                    <button data-direcao="d" class="rightButton">▶</button>
                </div>
            </div>
        </div>

        <canvas id="jogo"></canvas>
    </main>

    <script src="script.js"></script>
</body>

</html>
